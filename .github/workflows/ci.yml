name: CI

on:
  pull_request:
  push:
    branches: [master, dev]

concurrency:
  # Supersede in-flight runs for the same ref rather than queueing them.
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # This job runs repository-controlled install scripts; don't leave a
          # usable GITHUB_TOKEN in the local git config for them to read.
          persist-credentials: false

      # Must match the Node/npm used locally. npm 10 (Node 20) and npm 11
      # (Node 24) resolve optional and peer deps differently, so a lockfile
      # written by one fails `npm ci` under the other - which is exactly how
      # this workflow broke.
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      # If this fails with "Missing: <pkg> from lock file", the lockfile was
      # regenerated in a working copy that already had node_modules. npm reuses
      # the tree on disk when resolving, so optional native deps that failed to
      # build locally (bufferutil, utf-8-validate) get pruned from the lock and
      # then CI, which can build them, finds the lock incomplete. Regenerate in
      # a clean directory holding only package.json.
      - name: Install
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit -p .

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test -- --ci

      # The only check that catches a native module being evaluated in Node
      # during static prerender - tsc, lint and tests all pass while the web
      # build is broken. This has caught two real breakages.
      - name: Web export
        run: npx expo export --platform web --output-dir /tmp/ci-export

      # constants/brandIcons.ts is generated from simple-icons. If it drifts
      # from the generator, the committed icons no longer match the source.
      - name: Verify generated brand icons are up to date
        run: |
          npm run generate:brand-icons
          git diff --exit-code -- constants/brandIcons.ts
